<!DOCTYPE html>
<html>
<head>
    <title>Test Environment Variables</title>
</head>
<body>
    <h1>Testing Vercel Environment Variables</h1>
    <div id="result"></div>
    <script type="module">
        const result = document.getElementById('result');
        const viteMenuUrl = import.meta.env.VITE_MENU_URL;
        const viteApiUrl = import.meta.env.VITE_API_URL;
        
        result.innerHTML = `
            <p><strong>VITE_MENU_URL:</strong> ${viteMenuUrl || 'UNDEFINED ❌'}</p>
            <p><strong>VITE_API_URL:</strong> ${viteApiUrl || 'UNDEFINED ❌'}</p>
            <hr>
            <p>If you see UNDEFINED, environment variables are not configured in Vercel!</p>
        `;
    </script>
</body>
</html>
